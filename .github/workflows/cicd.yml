# Two-stage CI/CD for the serverless Customer Management Platform.
#
#   test - unit tests (mocked, no AWS). Gates every deploy.
#   dev  - applies on every push + PR (any branch), stack base name workshop-dev,
#          then runs integration tests against the just-deployed dev stack.
#   prod - applies only on push to main, gated by the protected GitHub
#          Environment "prod" (required reviewer), stack base name workshop-prod.
#
# Auth: GitHub OIDC -> AWS IAM role (repo variable AWS_DEPLOY_ROLE_ARN).
# State: local backend, persisted per stage as a GitHub Actions artifact. A
#        per-stage concurrency group serializes runs. Workshop-grade.

name: cicd

on:
  push:
  pull_request:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  TF_IN_AUTOMATION: "true"

jobs:
  # ----------------------------------------------------------------------- #
  # TEST: unit tests only (moto-mocked, no AWS). Fast gate before any deploy.
  # ----------------------------------------------------------------------- #
  test:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest tests/unit -v

  # ----------------------------------------------------------------------- #
  # DEV: all pushes/PRs. Applies, then runs integration tests on the stack.
  # ----------------------------------------------------------------------- #
  dev:
    name: deploy-dev
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python 3.13 (Lambda packaging + tests)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Download existing dev state (if any)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: terraform-state-dev
          path: infrastructure

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform apply (dev)
        run: terraform apply -auto-approve -input=false -state=terraform.tfstate -var="workshop_stack_base_name=workshop-dev"

      - name: Upload updated dev state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state-dev
          path: infrastructure/terraform.tfstate
          retention-days: 90
          overwrite: true
          if-no-files-found: warn

      - name: Install test dependencies
        run: python -m pip install -r ../requirements-dev.txt

      - name: Integration tests (against deployed dev stack)
        run: |
          API_BASE_URL=$(terraform output -raw api_invoke_url)
          COGNITO_USER_POOL_ID=$(terraform output -raw cognito_user_pool_id)
          COGNITO_CLIENT_ID=$(terraform output -raw cognito_user_pool_client_id)
          export API_BASE_URL COGNITO_USER_POOL_ID COGNITO_CLIENT_ID
          echo "Target API: $API_BASE_URL"
          cd .. && python -m pytest tests/integration -v -m integration

  # ----------------------------------------------------------------------- #
  # PROD: push to main only, manual approval via protected environment "prod".
  # ----------------------------------------------------------------------- #
  prod:
    name: deploy-prod
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: dev
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python 3.13 (Lambda packaging + tests)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Download existing prod state (if any)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: terraform-state-prod
          path: infrastructure

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform apply (prod)
        run: terraform apply -auto-approve -input=false -state=terraform.tfstate -var="workshop_stack_base_name=workshop-prod"

      - name: Upload updated prod state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state-prod
          path: infrastructure/terraform.tfstate
          retention-days: 90
          overwrite: true
          if-no-files-found: warn

      - name: Install test dependencies
        run: python -m pip install -r ../requirements-dev.txt

      - name: Integration tests (against deployed prod stack)
        run: |
          API_BASE_URL=$(terraform output -raw api_invoke_url)
          COGNITO_USER_POOL_ID=$(terraform output -raw cognito_user_pool_id)
          COGNITO_CLIENT_ID=$(terraform output -raw cognito_user_pool_client_id)
          export API_BASE_URL COGNITO_USER_POOL_ID COGNITO_CLIENT_ID
          echo "Target API: $API_BASE_URL"
          cd .. && python -m pytest tests/integration -v -m integration
