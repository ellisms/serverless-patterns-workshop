# Two-stage CI/CD for the serverless Customer Management Platform.
#
#   dev  - applies on every push + PR (any branch), stack base name workshop-dev
#   prod - applies only on push to main, gated by the protected GitHub
#          Environment "prod" (required reviewer), stack base name workshop-prod
#
# Auth: GitHub OIDC -> AWS IAM role (repo variable AWS_DEPLOY_ROLE_ARN).
# State: local backend, persisted per stage as a GitHub Actions artifact
#        (terraform-state-dev / terraform-state-prod). A per-stage concurrency
#        group serializes runs so two runs never race the same state/stack.
#        NOTE: workshop-grade; artifacts are not locking/durable. For anything
#        beyond a workshop use an S3 backend + DynamoDB lock.

name: cicd

on:
  push:
  pull_request:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  TF_IN_AUTOMATION: "true"

jobs:
  dev:
    name: deploy-dev
    runs-on: ubuntu-latest
    environment: dev
    # Serialize ALL dev runs globally so concurrent pushes never race the single
    # shared dev state/stack (the cause of duplicated/orphaned resources).
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python 3.13 (Lambda packaging)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Download existing dev state (if any)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: terraform-state-dev
          path: infrastructure

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform apply (dev)
        run: terraform apply -auto-approve -input=false -state=terraform.tfstate -var="workshop_stack_base_name=workshop-dev"

      - name: Upload updated dev state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state-dev
          path: infrastructure/terraform.tfstate
          retention-days: 90
          overwrite: true
          if-no-files-found: warn

  prod:
    name: deploy-prod
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: dev
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python 3.13 (Lambda packaging)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Download existing prod state (if any)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: terraform-state-prod
          path: infrastructure

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform apply (prod)
        run: terraform apply -auto-approve -input=false -state=terraform.tfstate -var="workshop_stack_base_name=workshop-prod"

      - name: Upload updated prod state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state-prod
          path: infrastructure/terraform.tfstate
          retention-days: 90
          overwrite: true
          if-no-files-found: warn
